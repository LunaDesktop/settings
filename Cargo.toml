[package]
name = "luna-settings"
version = "0.0.14"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"
authors = ["Patryk Szkudlarek / libLuna contributors"]
description = "Luna Settings — centrum ustawień środowiska i systemu (libLuna, bez GTK)."
# Po utworzeniu osobnego repozytorium ustaw np.:
# repository = "https://github.com/mijsys/luna-settings"

[workspace]
resolver = "2"

[dependencies]
libluna-core = { git = "https://github.com/LunaDesktop/libLuna.git", version = "0.0.9" }
libluna-i18n = { git = "https://github.com/LunaDesktop/libLuna.git", version = "0.0.9" }
libluna-render = { git = "https://github.com/LunaDesktop/libLuna.git", version = "0.0.9" }
libluna-platform = { git = "https://github.com/LunaDesktop/libLuna.git", version = "0.0.9" }
libluna-widgets = { git = "https://github.com/LunaDesktop/libLuna.git", version = "0.0.9" }
luna = { git = "https://github.com/LunaDesktop/luna.git", version = "0.0.16" }
zbus = { version = "5.12.0", features = ["blocking-api"] }

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
